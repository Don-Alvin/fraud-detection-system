services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: fraud-detection-dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api